name: General Validity

on: ["push"]

jobs:
  lint:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - run: corepack enable

      - name: yarn install
        run: yarn --immutable
        shell: bash

      - name: Lint
        run: yarn lint
        shell: bash

  test:
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: yarn install
        run: yarn --immutable
        shell: bash

      - name: test + coverage
        run: yarn test-coverage
        shell: bash

      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v2.2.3
        # env:
        # NODE_COVERALLS_DEBUG: 1
        with:
          github-token: ${{ secrets.github_token }}

  build:
    runs-on: ubuntu-20.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: yarn install
        run: yarn --immutable
        shell: bash

      - name: build
        run: yarn build
        shell: bash
